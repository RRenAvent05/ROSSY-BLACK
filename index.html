<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rossy Black — Luxury Portfolio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#050505;
      --bg-secondary:#0A0A0A;
      --card:#111111;
      --text:#FFFFFF;
      --muted:#A1A1AA;
      --purple:#8B5CF6;
      --pink:#EC4899;
      --violet:#7C3AED;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:'Inter',sans-serif;
      overflow-x:hidden;
    }

    .hero{
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      position:relative;
      background:
      radial-gradient(circle at top left, rgba(139,92,246,.15), transparent 40%),
      radial-gradient(circle at bottom right, rgba(236,72,153,.15), transparent 40%),
      #050505;
    }

    .blur{
      position:absolute;
      width:400px;
      height:400px;
      border-radius:50%;
      filter:blur(120px);
      opacity:.4;
      animation:float 8s ease-in-out infinite;
    }

    .blur.one{
      background:#8B5CF6;
      top:-100px;
      left:-100px;
    }

    .blur.two{
      background:#EC4899;
      bottom:-100px;
      right:-100px;
      animation-delay:2s;
    }

    h1{
      font-size:clamp(4rem,10vw,9rem);
      font-family:'Space Grotesk',sans-serif;
      font-weight:700;
      letter-spacing:-4px;
      background:linear-gradient(
      90deg,
      #ffffff,
      #c084fc,
      #ec4899,
      #ffffff
      );

      background-size:300%;
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;

      animation:gradientMove 8s linear infinite;
      z-index:2;
    }

    p{
      margin-top:20px;
      color:var(--muted);
      font-size:1.1rem;
      letter-spacing:1px;
      z-index:2;
    }

    .buttons{
      margin-top:40px;
      display:flex;
      gap:20px;
      z-index:2;
    }

    .btn{
      padding:14px 32px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.1);
      background:rgba(255,255,255,.03);
      backdrop-filter:blur(20px);
      color:white;
      text-decoration:none;
      transition:.4s ease;
      position:relative;
      overflow:hidden;
    }

    .btn:hover{
      transform:translateY(-4px);
      box-shadow:
      0 0 20px rgba(139,92,246,.35),
      0 0 40px rgba(236,72,153,.15);
      border-color:rgba(236,72,153,.3);
    }

    @keyframes gradientMove{
      0%{
        background-position:0%;
      }
      100%{
        background-position:300%;
      }
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(40px);
      }
    }

    @media(max-width:768px){
      .buttons{
        flex-direction:column;
      }

      h1{
        text-align:center;
      }

      p{
        text-align:center;
        padding:0 20px;
      }
    }

  </style>
</head>
<body>

  <section class="hero">

    <div class="blur one"></div>
    <div class="blur two"></div>

    <h1>Rossy Black</h1>

    <p>
      Luxury Creative Designer • Modern Visual Artist • Premium Portfolio
    </p>

    <div class="buttons">
      <a href="#" class="btn">View Projects</a>
      <a href="#" class="btn">Contact Me</a>
    </div>

  </section>

</body>
</html>
